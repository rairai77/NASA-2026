[package]
name = "lunar-engine"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Lunar landing site navigator compute engine (horizons, Sun/Earth visibility, ranking)"

[lib]
name = "lunar_engine"
crate-type = ["cdylib", "rlib"]

[features]
default = []
parallel = ["dep:rayon"]
python = ["dep:pyo3", "dep:numpy", "dep:flate2"]
wasm = ["dep:wasm-bindgen", "dep:js-sys", "dep:serde-wasm-bindgen", "dep:console_error_panic_hook"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = { version = "1", optional = true }
flate2 = { version = "1", optional = true }
pyo3 = { version = "0.28", optional = true, features = ["extension-module", "abi3-py39"] }
numpy = { version = "0.28", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
