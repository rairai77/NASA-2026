name = "lunar-site-navigator"
main = "worker/src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true

[assets]
directory = "web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Only /api/* hits the Worker script; everything else is served straight from assets.
run_worker_first = ["/api/*"]

[vars]
PARSE_MODEL = "anthropic/claude-haiku-5.5"
# PARSE_MOCK = "1"   # offline canned response, for local testing only

# Per-IP limit for /api/parse (20 requests / 60 s). Worker degrades gracefully if absent.
[[ratelimits]]
name = "PARSE_LIMITER"
namespace_id = "1001"
simple = { limit = 20, period = 60 }
