name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable + wasm32)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Install uv and Python 3.13
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Restore raw downloads cache
        id: raw-cache
        uses: actions/cache/restore@v4
        with:
          path: pipeline/raw
          key: raw-${{ hashFiles('pipeline/fetch.py', 'pipeline/validate_pgda.py') }}

      - name: Restore generated data cache
        id: data-cache
        uses: actions/cache/restore@v4
        with:
          path: web/public/data
          key: data-${{ hashFiles('pipeline/**/*.py', 'pipeline/run_all.sh', 'pipeline/pyproject.toml', 'pipeline/uv.lock', 'engine/src/geo.rs', 'engine/src/ephem.rs', 'engine/src/terrain.rs', 'engine/src/horizon.rs', 'engine/src/visibility.rs', 'engine/src/grid.rs', 'engine/src/metrics.rs', 'data-src/**') }}

      - name: Generate data (pipeline)
        id: pipeline
        run: pipeline/run_all.sh

      # Save right after the pipeline so a failed build/deploy does not lose an expensive run.
      - name: Save raw downloads cache
        if: always() && steps.raw-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: pipeline/raw
          key: raw-${{ hashFiles('pipeline/fetch.py', 'pipeline/validate_pgda.py') }}

      - name: Save generated data cache
        if: always() && steps.pipeline.outcome == 'success' && steps.data-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: web/public/data
          key: data-${{ hashFiles('pipeline/**/*.py', 'pipeline/run_all.sh', 'pipeline/pyproject.toml', 'pipeline/uv.lock', 'engine/src/geo.rs', 'engine/src/ephem.rs', 'engine/src/terrain.rs', 'engine/src/horizon.rs', 'engine/src/visibility.rs', 'engine/src/grid.rs', 'engine/src/metrics.rs', 'data-src/**') }}

      - name: Generate site list for the Worker prompt
        run: node scripts/gen-sites.mjs

      - name: Build engine (wasm) and web app
        run: scripts/build.sh

      - name: Check for Cloudflare credentials
        id: cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice title=Deploy skipped::CLOUDFLARE_API_TOKEN secret is not set; build succeeded but nothing was deployed."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Cloudflare
        if: steps.cf.outputs.enabled == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.162.0"
          command: deploy
          secrets: |
            OPENROUTER_API_KEY
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
